services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://assistant:assistant@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
      BLUETICKS_MCP_URL: https://api.blueticks.co/mcp
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_ENABLE_DEV_AUTH: "true"
        NEXT_PUBLIC_DEV_USER: local-developer
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  mcp-server:
    profiles: ["mcp"]
    build: ./mcp-server
    environment:
      APP_ENV: development
      MCP_TRANSPORT: streamable-http
      MCP_PORT: "8001"
      ASSISTANT_API_URL: http://backend:8000
      ASSISTANT_USER_ID: ${ASSISTANT_USER_ID:-local-developer}
      ASSISTANT_BACKEND_TOKEN: ${ASSISTANT_BACKEND_TOKEN:-}
    ports: ["127.0.0.1:8001:8001"]
    depends_on: [backend]
volumes:
  pgdata:
