AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Preparation-only foundation for My AI Personal Assistant in ap-south-2.
  This template is NOT a guarantee of zero cost. Review pricing and Free Plan
  eligibility before creating a stack. No stack has been deployed.
Parameters:
  ProjectName:
    Type: String
    Default: my-ai-assistant
    AllowedPattern: '^[a-z0-9-]{3,30}$'
    Description: Lowercase resource prefix.
Resources:
  AssistantUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      UserPoolAddOns:
        AdvancedSecurityMode: OFF
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
  AssistantUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref AssistantUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-users'
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  ChatHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-chat-history'
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: createdAt, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: createdAt, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-audit-logs'
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: eventId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: eventId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  AppPermissionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-app-permissions'
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: appId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: appId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  AssistantTaskDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-tasks-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  AssistantTaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-tasks'
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AssistantTaskDeadLetterQueue.Arn
        maxReceiveCount: 3
  AssistantApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AssistantUserPool}'
              audience:
                - !Ref AssistantUserPoolClient
Outputs:
  UserPoolId:
    Value: !Ref AssistantUserPool
  UserPoolClientId:
    Value: !Ref AssistantUserPoolClient
  UsersTableName:
    Value: !Ref UsersTable
  ChatHistoryTableName:
    Value: !Ref ChatHistoryTable
  AuditLogsTableName:
    Value: !Ref AuditLogsTable
  AppPermissionsTableName:
    Value: !Ref AppPermissionsTable
  TaskQueueUrl:
    Value: !Ref AssistantTaskQueue
  TaskDeadLetterQueueUrl:
    Value: !Ref AssistantTaskDeadLetterQueue
  HttpApiId:
    Value: !Ref AssistantApi
