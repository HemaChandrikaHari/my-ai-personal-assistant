name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app mcp-server
      - run: PYTHONPATH=mcp-server python -c "import server; assert server.TRANSPORT == 'stdio'"
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - run: cd backend && DATABASE_URL=sqlite+aiosqlite:///./ci_migration.db python -m alembic upgrade head
      - name: Verify migrations against PostgreSQL 16
        run: cd backend && DATABASE_URL=postgresql+asyncpg://assistant:assistant@localhost:5432/assistant_ci python -m alembic upgrade head
      - name: Build backend container (includes production migrations)
        run: docker build --tag personal-assistant-backend:ci ./backend
      - name: Run backend container smoke tests
        shell: bash
        run: |
          docker run --detach --name personal-assistant-backend-ci --publish 8000:8000 \
            --env APP_ENV=development \
            --env DATABASE_URL=sqlite+aiosqlite:////tmp/assistant-ci.db \
            --env CORS_ORIGINS=http://localhost:3000 \
            personal-assistant-backend:ci
          cleanup() { docker rm --force personal-assistant-backend-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs personal-assistant-backend-ci
            exit 1
          fi
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --header "X-User-ID: ci-smoke-user" http://localhost:8000/api/v1/integrations
          curl --fail --silent --header "X-User-ID: ci-smoke-user" http://localhost:8000/api/v1/connections
      - name: Build MCP container
        run: docker build --tag personal-assistant-mcp:ci ./mcp-server
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm audit --audit-level=high && npm run build
      - name: Build production frontend container
        run: docker build --tag personal-assistant-frontend:ci --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid --build-arg NEXT_PUBLIC_ENABLE_DEV_AUTH=false ./frontend
